# Train first (uv run python -m scripts.train --csv data/vehicles.csv) so artifacts/ and reports/ exist.
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./artifacts:/app/artifacts", "./reports:/app/reports"]
    environment:
      - DEALERLENS_LLM_URL=http://host.docker.internal:8081/v1
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
  app:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
    volumes: ["./artifacts:/app/artifacts", "./reports:/app/reports"]
    environment:
      - DEALERLENS_LLM_URL=http://host.docker.internal:8081/v1
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
