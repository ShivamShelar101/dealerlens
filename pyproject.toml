[project]
name = "dealerlens"
version = "0.1.0"
description = "Appraisal copilot for used-car dealers: calibrated valuations, comps, risk checks, tool-using agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "joblib",
    "lightgbm",
    "numpy",
    "pandas",
    "python-multipart",
    "requests",
    "scikit-learn",
    "streamlit",
    "tabulate",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "httpx", "jupyter", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
